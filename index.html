<script>

 if(m.t==='state'){const old=S;S=m;if(m.phase==='play')dl=Date.now()+m.left;
  if(old&&m.ps.length>old.ps.length)sfx.join();

/* ---------- render ---------- */

 ({lobby,play,reveal,final})[S.phase]()}

  h('div',{c:'card c'},big,nn,h('div',{c:'row c',style:'margin-top:10px;max-height:110px;overflow:auto'},AV.map(a=>h('button',{c:'g',style:'padding:4px 8px;font-size:22px',onclick:()=>{ID.av=a;big.textContent=a;sfx.vote()}},a)))),
  h('div',{c:'card'},h('button',{style:'width:100%',onclick:()=>join(true,'')},'สร้างห้องเลย 🚀'),h('p',{c:'c',style:'margin:10px'},'หรือ'),h('div',{c:'row'},rc,h('button',{onclick:()=>join(false,rc.value)},'เข้าห้อง'))));

 cur='l';const host=S.me===S.host,o=S.ps.filter(p=>p.on),all=o.every(p=>p.id===S.host||p.ready);

 const setb=(k,v,l)=>h('button',{c:'g'+(S.set[k]===v?' on':''),disabled:!host,onclick:()=>tx({t:'set',[k]:v})},l);
 const st=h('button',{disabled:!(host&&o.length>=3&&all),onclick:()=>tx({t:'start'})},o.length<3?'ต้องมีอย่างน้อย 3 คน':!all?'รอทุกคนกดพร้อม':'เริ่มเลย 🔥');
 app.replaceChildren(h('div',{c:'card c'},h('small',{},'โค้ดห้อง'),h('div',{c:'code'},S.room),h('button',{onclick:()=>navigator.clipboard.writeText(link).then(()=>toast('คัดลอกลิงก์เชิญแล้ว 🔗'))},'คัดลอกลิงก์เชิญ 🔗')),
  h('div',{c:'card'},h('b',{},`ในห้อง ${o.length} คน`),h('div',{c:'grid',style:'margin-top:10px'},S.ps.map(p=>h('div',{c:'pl'},h('i',{c:'dot'+(p.on?'':' off')}),p.id===S.host?h('span',{c:'bdg'},'👑'):p.ready&&h('span',{c:'bdg'},'✅'),h('div',{c:'av'},p.av),h('div',{},p.name+(p.id===S.me?' (เรา)':'')),host&&p.id!==S.me&&h('button',{c:'kick',onclick:()=>confirm('เตะ '+p.name+'?')&&tx({t:'kick',id:p.id})},'เตะ'))))),
  h('div',{c:'card'},h('b',{},'โหมด'),h('div',{c:'row',style:'margin:8px 0'},setb('mode','free','✍️ เขียนโจทย์เอง'),setb('mode','rand','🎲 ระบบสุ่มโจทย์')),h('b',{},'เวลาต่อรอบ'),h('div',{c:'row',style:'margin-top:8px'},[30,45,60,90].map(t=>setb('time',t,t+' วิ'))),!host&&h('small',{},'โฮสต์เป็นคนตั้งค่า เห็นแบบเรียลไทม์')),

/* ---------- play ---------- */
